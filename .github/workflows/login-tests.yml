name: Run Login Page Tests

# Trigger the test on every push or pull request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest # GitHub provided clean virtual machine

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install project dependencies
      run: npm ci

    - name: Install Playwright browsers (Chromium/Firefox/Webkit)
      run: npx playwright install --with-deps

    - name: Execute automated login tests
      run: npm run test
